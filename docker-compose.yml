services:

  # ============================================================
  # db — PostgreSQL 15 + PostGIS 3.4
  #
  # Replica o banco do Supabase localmente para desenvolvimento.
  # Inclui o schema auth.* mock (via docker-init/00_auth_mock.sql)
  # e aplica todas as migrations automaticamente na primeira vez.
  #
  # Conexão local:
  #   postgresql://postgres:<DB_PASSWORD>@localhost:<DB_PORT>/una_dev
  #
  # Em produção, este serviço não é usado —
  # o Supabase gerencia o banco diretamente.
  # ============================================================
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: una_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # SEED_DB=true popula o banco com dados de teste do campus UFPE
      SEED_DB: ${SEED_DB:-false}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Dados persistentes entre restarts
      - postgres_data:/var/lib/postgresql/data
      # Scripts de inicialização (rodados UMA VEZ na criação do volume)
      - ./database/docker-init/00_auth_mock.sql:/docker-entrypoint-initdb.d/00_auth_mock.sql:ro
      - ./database/docker-init/01_run_migrations.sh:/docker-entrypoint-initdb.d/01_run_migrations.sh:ro
      # Migrations montadas para o script de init e para uso com psql manual
      - ./database/migrations:/migrations:ro
      - ./database/seed.sql:/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d una_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================
  # redis — Cache em memória (opcional para MVP)
  #
  # Usado pelo NestJS backend para:
  #   - Cache de sessões JWT
  #   - Cache dos dados do mapa (pontos de coleta)
  #
  # Ativar com: docker compose --profile cache up
  # ============================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [cache]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: una_postgres_data
  redis_data:
    name: una_redis_data
